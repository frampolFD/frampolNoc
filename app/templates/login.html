<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login — Frampol NOC</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="/static/js/api.js"></script>
</head>
<body>
  <div class="login-shell">
    <div class="login-box">
      <h1>FRAMPOL <span style="color:var(--brand-burgundy)">NOC</span></h1>
      <div class="sub">WAN Monitoring Platform</div>
      <div id="error" class="notice error" style="display:none"></div>
      <form id="login-form">
        <div class="form-field">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-field">
          <label>Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn primary">Sign in</button>
      </form>
    </div>
  </div>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const errorEl = document.getElementById("error");
      errorEl.style.display = "none";
      try {
        await api("/api/auth/login", {
          method: "POST",
          body: { email: document.getElementById("email").value, password: document.getElementById("password").value },
        });
        window.location.href = "/";
      } catch (e) {
        errorEl.textContent = e.message;
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
